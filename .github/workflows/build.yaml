name: README build

on:
  push:
    branches:
      - main
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: readme-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run typecheck

      - name: Fetch website exports and update README
        run: bun run update
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Commit
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add README.md assets/github-*.svg assets/article-*.png
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore: sync README from website"
          git push
